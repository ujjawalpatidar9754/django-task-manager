<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>
    <!-- Bootstrap 5 CSS CDN for nice styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4 text-center">My Tasks Manager</h1>
        
        <div class="card shadow">
            <div class="card-body">
                <ul class="list-group">
                    {% for task in tasks %}
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <div>
                                <h5>{{ task.title }}</h5>
                                <p class="text-muted mb-0">{{ task.description }}</p>
                                <a href="{% url 'task_update' task.id %}" class="btn btn-sm btn-warning">Edit</a>
                               <a href="{% url 'task_delete' task.id %}" class="btn btn-sm btn-danger">Delete</a>
                            </div>
                            <div>
                                {% if task.completed %}
                                    <span class="badge bg-success">Completed</span>
                                {% else %}
                                    <span class="badge bg-warning text-dark">Pending</span>
                                {% endif %}
                            </div>
                        </li>
                    {% empty %}
                        <li class="list-group-item text-center">No tasks found!</li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
