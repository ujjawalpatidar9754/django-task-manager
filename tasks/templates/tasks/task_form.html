<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Task</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <h2 class="mb-4 text-center">Add New Task</h2>
        
        <div class="card shadow">
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100">Save Task</button>
                </form>
                <a href="{% url 'task_list' %}" class="btn btn-secondary w-100 mt-2">Back to List</a>
            </div>
        </div>
    </div>
</body>
</html>
